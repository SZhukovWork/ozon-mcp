[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ozon-mcp"
version = "0.1.0"
description = "MCP server for Ozon: live prices with honest labels, paginated search, product cards with seller and delivery date, reviews"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "ozon", "marketplace", "price-comparison", "llm-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.2,<3",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ozon-mcp = "ozon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Ozon storefront (deselected unless -m live)"]
addopts = "-m 'not live'"
